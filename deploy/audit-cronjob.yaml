# Runs platform-audit nightly with read-only access.
# Build and push the image first (see README), then: oc apply -f deploy/audit-cronjob.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: platform-tools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-audit
  namespace: platform-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-audit-reader
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-audit-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-audit-reader
subjects:
  - kind: ServiceAccount
    name: platform-audit
    namespace: platform-tools
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-audit
  namespace: platform-tools
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: platform-audit
          restartPolicy: Never
          containers:
            - name: audit
              image: quay.io/YOUR_ORG/platform-toolkit:0.1.0   # TODO(you)
              command: ["platform-audit", "--output", "json"]
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 200m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
