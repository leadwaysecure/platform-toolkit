[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-toolkit"
version = "0.1.0"
description = "Platform audit and AI-assisted triage tools for OpenShift"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "kubernetes>=29.0",
  "pydantic>=2.6",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
platform-audit = "platform_toolkit.audit:app"
triage = "platform_toolkit.triage:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
